{% if f.derived_from %}
  <label class="derived">{{ f.label }}
    <input type="text" value="from the selected {{ f.derived_from }}" disabled>
    <small>{{ f.help }}</small>
  </label>
{% elif f.kind == 'select' %}
  <label>{{ f.label }}
    <select name="{{ f.name }}">
      {% for c in f.choices %}<option value="{{ c }}" {{ 'selected' if c == f.default }}>{{ c }}</option>{% endfor %}
    </select>
    {% if f.help %}<small>{{ f.help }}</small>{% endif %}
  </label>
{% elif f.kind == 'checkbox' %}
  <label class="inline"><input type="checkbox" name="{{ f.name }}" {{ 'checked' if f.default }}> {{ f.label }}
    {% if f.help %}<small>{{ f.help }}</small>{% endif %}
  </label>
{% else %}
  <label>{{ f.label }}{% if f.required %} <span class="req">required</span>{% endif %}
    <input type="{{ 'number' if f.kind == 'number' else 'text' }}" name="{{ f.name }}"
           {% if f.default is not none %}placeholder="{{ f.default }}"{% endif %}
           {% if f.minimum is not none %}min="{{ f.minimum }}"{% endif %}
           {% if f.maximum is not none %}max="{{ f.maximum }}"{% endif %}
           {% if f.kind == 'number' and f.name == 'aln_score_threshold' %}step="any"{% endif %}
           {{ 'required' if f.required }}>
    {% if f.help %}<small>{{ f.help }}</small>{% endif %}
  </label>
{% endif %}
