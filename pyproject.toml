[project]
name = "telomers"
version = "0.1.0"
description = "Telomere length measurement from nanopore reads, for lab use"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.32",
    "PyYAML>=6",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
telomers = "telomers.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telomers"]

[tool.ruff]
line-length = 100
