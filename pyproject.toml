[project]
name = "telomers"
version = "0.1.0"
description = "Telomere length measurement from nanopore reads, for lab use"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML>=6",
]

[project.scripts]
telomers = "telomers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telomers"]

[tool.ruff]
line-length = 100
